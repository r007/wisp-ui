name: Storybook

# Publishes the component explorer to GitHub Pages.
#
# Manual until Pages is set up (see docs/maintaining.md); a push-triggered deploy
# to a repository without Pages fails on every push. Once Pages works, add:
#   push:
#     branches: [main]

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/react/storybook-static
      - id: deployment
        uses: actions/deploy-pages@v4
