name: Release

# Opens (or updates) a "Version packages" pull request from pending changesets.
# Merging it publishes to npm.
#
# Manual until releasing is set up (see docs/maintaining.md): it needs the
# `@wisp-ui` npm scope, an NPM_TOKEN secret, and Settings → Actions → "Allow
# GitHub Actions to create and approve pull requests". Without them it fails and
# leaves a `changeset-release/main` branch behind. Once configured, add:
#   push:
#     branches: [main]

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
